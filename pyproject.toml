[project]
name = "phoneme-modelling"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Henrique Schmitz", email = "schhenrique@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "certifi>=2026.10.23",
    "google-cloud-texttospeech>=2.38.0",
    "google-genai>=2.33.0",
    "lhotse>=1.33.0",
    "librosa>=1.0.0",
    "onnxruntime>=1.31.1",
    "openai>=3.46.0",
    "pandas>=3.1.0",
    "praat-parselmouth>=0.4.7",
    "pydantic>=2.14.1",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "torch>=2.14.1",
    "transformers>=5.21.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.14.0",
]

[project.scripts]
phoneme-modelling = "phoneme_modelling:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
